# Role information is consumed from headers, not issued here.
# The ASP.NET Core API is the identity source of truth.
version: 1

headers:
  api_key: X-API-Key
  user_id: X-User-Id
  roles: X-User-Roles
  email: X-User-Email

# Required on every protected call from AiGateway:
#   X-API-Key, X-User-Id, X-User-Roles
# Chat (JWT): real user id + role from claims
# Background jobs: X-User-Id=system, X-User-Roles=Admin

# Existing .NET callers that omit roles fall back here (prefer explicit headers).
legacy_default_role: Analyst

roles:
  Admin:
    description: Platform operators — observability, cancel, health internals
  Analyst:
    description: Evaluation and chat callers
  Viewer:
    description: Read-only job status
  CountryUser:
    description: Portal country users (chat)
  Evaluator:
    description: Evaluators

# Endpoint groups → allowed roles. Health/docs stay public (no API key).
# Caller IP must also be in ALLOWED_CALLER_IPS (.env).
policies:
  public:
    - health
    - docs
  analyst:
    - evaluation
    - chat
    - rag
    - jobs_read
  admin:
    - admin
    - jobs_cancel
    - jobs_list_all
