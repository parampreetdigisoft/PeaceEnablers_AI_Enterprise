# Multi-LLM routing. If only one provider is enabled, the router never fans out:
# job coalescing already guarantees one LLM call per resource job.
version: 1

# auto = if exactly one provider.enabled is true, skip the classifier and use it.
single_llm_mode: auto

default_provider: openai
default_temperature: 0.1
default_max_tokens: 4000

# After N consecutive provider failures, skip that provider for cooldown_seconds.
circuit_breaker:
  enabled: true
  failure_threshold: 3
  cooldown_seconds: 60

semantic_cache:
  enabled: true
  similarity_threshold: 0.95
  ttl_seconds: 3600

providers:
  openai:
    enabled: true
    type: openai
    model: gpt-4o-mini
    temperature: 0.1
    max_tokens: 4000
  openrouter:
    enabled: false
    type: openrouter
    model: google/gemini-2.0-flash-exp:free
    temperature: 0.1
    max_tokens: 4000
  anthropic:
    enabled: false
    type: anthropic
    model: claude-3-5-haiku-latest
    temperature: 0.1
    max_tokens: 4000
  local:
    enabled: false
    type: local
    model: llama3
    temperature: 0.1
    max_tokens: 2000

# Purpose → tier. The router picks the first enabled provider in that tier's
# provider_order, then falls through fallback_order on failure.
tiers:
  router:
    purpose: classification
    max_latency_ms: 10
    provider_order: [openai, local]
  simple:
    purposes: [kpi_lookup, definition, faq]
    max_latency_ms: 1000
    provider_order: [openai, local]
  moderate:
    purposes: [chat, single_pillar, country_summary, document]
    max_latency_ms: 3000
    provider_order: [openai, openrouter, anthropic]
  complex:
    purposes: [evaluation_question, evaluation_pillar, comparison, cross_pillar]
    max_latency_ms: 8000
    provider_order: [openai, anthropic, openrouter]
  executive:
    purposes: [evaluation_country, executive_brief, immediate_situation]
    max_latency_ms: 15000
    provider_order: [openai, anthropic]

fallback_order:
  - openai
  - anthropic
  - openrouter
  - local
